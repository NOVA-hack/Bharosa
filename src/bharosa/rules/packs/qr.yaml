# UPI QR rule pack. Every rule here is evaluated by bharosa.checks.qr.
# Severity weights: high 60, medium 30, low 10. always_high forces a high verdict.
version: "qr-2026.11.1"

# PSP handles that the prototype recognises. Synthetic list for the demo; extend as needed.
known_psp_handles:
  - okaxis
  - oksbi
  - okhdfcbank
  - okicici
  - ybl
  - ibl
  - axl
  - paytm
  - ptyes
  - ptaxis
  - pthdfc
  - ptsbi
  - upi
  - apl
  - yapl
  - rapl
  - kotak
  - icici
  - hdfcbank
  - sbi
  - axisbank
  - barodampay
  - pnb
  - unionbank
  - kbl
  - federal
  - idfcfirst
  - indus
  - yesbank
  - jupiteraxis
  - fam
  - slice
  - freecharge
  - airtel
  - jio
  - waicici
  - waaxis
  - wasbi
  - wahdfcbank

# Words in the note (tn) that promise money TO the person scanning. Scanning a QR never receives money.
receive_money_words:
  - receive
  - cashback
  - cash back
  - refund
  - prize
  - reward
  - lottery
  - won
  - winner
  - claim
  - credited
  - bonus
  - gift
  - "प्राप्त"
  - "रिफंड"
  - "इनाम"
  - "कैशबैक"
  - "लॉटरी"
  - "paisa milega"
  - "inaam"
  - "ಬಹುಮಾನ"
  - "ಮರುಪಾವತಿ"
  - "ಕ್ಯಾಶ್‌ಬ್ಯಾಕ್"

urgent_words:
  - urgent
  - immediately
  - today only
  - last chance
  - within
  - turant
  - jaldi
  - "तुरंत"
  - "जल्दी"
  - "ತಕ್ಷಣ"
  - fine
  - penalty
  - blocked
  - suspend

# Payee names that claim to be a bank, government body or big brand. A real merchant QR rarely uses these.
authority_name_words:
  - bank
  - rbi
  - reserve bank
  - npci
  - government
  - govt
  - police
  - cbi
  - customs
  - income tax
  - court
  - cyber cell
  - customer care
  - helpdesk
  - support
  - kyc
  - refund dept
  - electricity board
  - bescom
  - sbi
  - hdfc
  - icici
  - paytm
  - phonepe
  - google pay
  - amazon
  - flipkart

rules:
  QR-NOT-UPI:
    severity: high
    title: "The QR code is not a UPI payment request"
  QR-MALFORMED:
    severity: medium
    title: "The UPI payment details are incomplete or malformed"
  QR-RECEIVE-MONEY:
    severity: high
    always_high: true
    title: "The note promises you money, but scanning a QR never gives you money"
    truth_card: TC-QR-NEVER-RECEIVE
  QR-UNKNOWN-PSP:
    severity: medium
    title: "The UPI ID uses a payment handle Bharosa does not recognise"
  QR-AUTHORITY-NAME:
    severity: medium
    title: "The payee name claims to be a bank, government body or brand"
  QR-AMOUNT-URGENT:
    severity: medium
    title: "A fixed amount is set together with an urgent or threatening note"
  QR-NON-INR:
    severity: medium
    title: "The currency is not Indian Rupees"
  QR-REPORTED-PAYEE:
    severity: high
    always_high: true
    title: "This payee was blocked or reported by your family before"
  QR-FIRST-PAYEE:
    severity: low
    title: "This is the first payment to this payee from your family"
  QR-FIRST-PAYEE-HIGH-AMOUNT:
    severity: medium
    title: "First payment to this payee, and the amount is above your family's review limit"
  QR-LARGE-AMOUNT:
    severity: low
    title: "The amount is unusually large for a QR payment"
