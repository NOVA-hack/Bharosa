# Interface strings and per-rule explanations in English (en), Hindi (hi) and Kannada (kn).
# English rule explanations come from each pack's `title`; this file holds the translations.
# Translations were written by the team and should be reviewed by a native speaker before a public demo.
version: "i18n-2026.11.1"

ui:
  level_low:
    en: "No known warning signs found"
    hi: "कोई ज्ञात चेतावनी संकेत नहीं मिला"
    kn: "ಯಾವುದೇ ತಿಳಿದಿರುವ ಎಚ್ಚರಿಕೆ ಚಿಹ್ನೆ ಕಂಡುಬಂದಿಲ್ಲ"
  level_medium:
    en: "Caution: warning signs found"
    hi: "सावधान: चेतावनी संकेत मिले"
    kn: "ಎಚ್ಚರಿಕೆ: ಅಪಾಯದ ಚಿಹ್ನೆಗಳು ಕಂಡುಬಂದಿವೆ"
  level_high:
    en: "Stop: this looks like a scam"
    hi: "रुकिए: यह धोखाधड़ी लगती है"
    kn: "ನಿಲ್ಲಿ: ಇದು ವಂಚನೆಯಂತೆ ಕಾಣುತ್ತದೆ"
  low_disclaimer:
    en: "This means Bharosa's checks did not find a known warning pattern. It does not prove the request is safe."
    hi: "इसका मतलब है कि Bharosa की जाँच में कोई ज्ञात चेतावनी पैटर्न नहीं मिला। यह साबित नहीं करता कि अनुरोध सुरक्षित है।"
    kn: "ಇದರ ಅರ್ಥ Bharosa ಪರಿಶೀಲನೆಯಲ್ಲಿ ತಿಳಿದಿರುವ ಎಚ್ಚರಿಕೆ ಮಾದರಿ ಸಿಗಲಿಲ್ಲ. ವಿನಂತಿ ಸುರಕ್ಷಿತ ಎಂದು ಇದು ಸಾಬೀತುಪಡಿಸುವುದಿಲ್ಲ."
  held:
    en: "Bharosa has paused this payment and asked your family to review it."
    hi: "Bharosa ने यह भुगतान रोक दिया है और आपके परिवार से इसकी जाँच करने को कहा है।"
    kn: "Bharosa ಈ ಪಾವತಿಯನ್ನು ತಡೆಹಿಡಿದಿದೆ ಮತ್ತು ನಿಮ್ಮ ಕುಟುಂಬಕ್ಕೆ ಪರಿಶೀಲಿಸಲು ಕೇಳಿದೆ."
  do_not_pay:
    en: "Do not pay, do not share any OTP or PIN, and do not install any app."
    hi: "भुगतान न करें, कोई OTP या PIN न बताएं, और कोई ऐप इंस्टॉल न करें।"
    kn: "ಪಾವತಿಸಬೇಡಿ, ಯಾವುದೇ OTP ಅಥವಾ PIN ಹೇಳಬೇಡಿ, ಯಾವುದೇ ಆ್ಯಪ್ ಇನ್‌ಸ್ಟಾಲ್ ಮಾಡಬೇಡಿ."
  cooloff:
    en: "Take a breath. Real officials and real offers can wait ten minutes. Call {guardian} now."
    hi: "एक गहरी साँस लीजिए। असली अधिकारी और असली ऑफ़र दस मिनट रुक सकते हैं। अभी {guardian} को कॉल करें।"
    kn: "ಒಂದು ದೀರ್ಘ ಉಸಿರು ತೆಗೆದುಕೊಳ್ಳಿ. ನಿಜವಾದ ಅಧಿಕಾರಿಗಳು ಮತ್ತು ನಿಜವಾದ ಕೊಡುಗೆಗಳು ಹತ್ತು ನಿಮಿಷ ಕಾಯಬಹುದು. ಈಗಲೇ {guardian} ಅವರಿಗೆ ಕರೆ ಮಾಡಿ."
  code_word:
    en: "This message claims to be from family. Ask them for the family code word before doing anything."
    hi: "यह संदेश परिवार के किसी सदस्य का होने का दावा करता है। कुछ भी करने से पहले उनसे परिवार का कोड वर्ड पूछें।"
    kn: "ಈ ಸಂದೇಶ ಕುಟುಂಬದವರಿಂದ ಎಂದು ಹೇಳುತ್ತದೆ. ಏನನ್ನೂ ಮಾಡುವ ಮೊದಲು ಅವರಿಂದ ಕುಟುಂಬದ ಗುಪ್ತ ಪದವನ್ನು ಕೇಳಿ."
  approved:
    en: "Your family reviewed this and approved it. Approval is an extra check, not proof the payment is genuine."
    hi: "आपके परिवार ने इसकी जाँच करके मंज़ूरी दी है। मंज़ूरी एक अतिरिक्त जाँच है, यह भुगतान के असली होने का सबूत नहीं है।"
    kn: "ನಿಮ್ಮ ಕುಟುಂಬ ಇದನ್ನು ಪರಿಶೀಲಿಸಿ ಅನುಮೋದಿಸಿದೆ. ಅನುಮೋದನೆ ಹೆಚ್ಚುವರಿ ಪರಿಶೀಲನೆ ಮಾತ್ರ, ಪಾವತಿ ನಿಜವೆಂಬುದಕ್ಕೆ ಪುರಾವೆ ಅಲ್ಲ."
  blocked:
    en: "Your family blocked this. Do not pay."
    hi: "आपके परिवार ने इसे रोक दिया है। भुगतान न करें।"
    kn: "ನಿಮ್ಮ ಕುಟುಂಬ ಇದನ್ನು ತಡೆದಿದೆ. ಪಾವತಿಸಬೇಡಿ."
  stopped:
    en: "Emergency Stop is on. Bharosa has locked all pending payments. Call 1930 to report fraud."
    hi: "इमरजेंसी स्टॉप चालू है। Bharosa ने सभी लंबित भुगतान रोक दिए हैं। धोखाधड़ी की शिकायत के लिए 1930 पर कॉल करें।"
    kn: "ತುರ್ತು ನಿಲುಗಡೆ ಸಕ್ರಿಯವಾಗಿದೆ. Bharosa ಎಲ್ಲಾ ಬಾಕಿ ಪಾವತಿಗಳನ್ನು ಲಾಕ್ ಮಾಡಿದೆ. ವಂಚನೆ ವರದಿ ಮಾಡಲು 1930 ಕ್ಕೆ ಕರೆ ಮಾಡಿ."
  expired:
    en: "Nobody reviewed this in time, so it stays paused."
    hi: "समय पर किसी ने इसकी जाँच नहीं की, इसलिए यह रुका हुआ है।"
    kn: "ಸಮಯಕ್ಕೆ ಯಾರೂ ಪರಿಶೀಲಿಸಲಿಲ್ಲ, ಆದ್ದರಿಂದ ಇದು ತಡೆಹಿಡಿಯಲ್ಪಟ್ಟಿದೆ."

rules:
  QR-NOT-UPI:
    hi: "यह QR कोड UPI भुगतान अनुरोध नहीं है"
    kn: "ಈ QR ಕೋಡ್ UPI ಪಾವತಿ ವಿನಂತಿ ಅಲ್ಲ"
  QR-MALFORMED:
    hi: "UPI भुगतान की जानकारी अधूरी या गलत है"
    kn: "UPI ಪಾವತಿ ವಿವರಗಳು ಅಪೂರ್ಣ ಅಥವಾ ತಪ್ಪಾಗಿವೆ"
  QR-RECEIVE-MONEY:
    hi: "संदेश में पैसे मिलने का वादा है, लेकिन QR स्कैन करने से कभी पैसे नहीं मिलते"
    kn: "ಸಂದೇಶವು ಹಣ ಸಿಗುವುದಾಗಿ ಹೇಳುತ್ತದೆ, ಆದರೆ QR ಸ್ಕ್ಯಾನ್ ಮಾಡಿದರೆ ಎಂದಿಗೂ ಹಣ ಸಿಗುವುದಿಲ್ಲ"
  QR-UNKNOWN-PSP:
    hi: "UPI ID में ऐसा भुगतान हैंडल है जिसे Bharosa नहीं पहचानता"
    kn: "UPI ID ಯಲ್ಲಿ Bharosa ಗುರುತಿಸದ ಪಾವತಿ ಹ್ಯಾಂಡಲ್ ಇದೆ"
  QR-AUTHORITY-NAME:
    hi: "भुगतान पाने वाला खुद को बैंक, सरकारी विभाग या ब्रांड बताता है"
    kn: "ಹಣ ಪಡೆಯುವವರು ತಮ್ಮನ್ನು ಬ್ಯಾಂಕ್, ಸರ್ಕಾರಿ ಇಲಾಖೆ ಅಥವಾ ಬ್ರ್ಯಾಂಡ್ ಎಂದು ಹೇಳುತ್ತಾರೆ"
  QR-AMOUNT-URGENT:
    hi: "रकम पहले से तय है और साथ में जल्दबाज़ी या धमकी वाला संदेश है"
    kn: "ಮೊತ್ತ ಮೊದಲೇ ನಿಗದಿಯಾಗಿದೆ ಮತ್ತು ಜೊತೆಗೆ ತುರ್ತು ಅಥವಾ ಬೆದರಿಕೆಯ ಸಂದೇಶವಿದೆ"
  QR-NON-INR:
    hi: "मुद्रा भारतीय रुपया नहीं है"
    kn: "ಕರೆನ್ಸಿ ಭಾರತೀಯ ರೂಪಾಯಿ ಅಲ್ಲ"
  QR-REPORTED-PAYEE:
    hi: "इस भुगतान पाने वाले को आपके परिवार ने पहले रोका या रिपोर्ट किया था"
    kn: "ಈ ಹಣ ಪಡೆಯುವವರನ್ನು ನಿಮ್ಮ ಕುಟುಂಬ ಹಿಂದೆ ತಡೆದಿದೆ ಅಥವಾ ವರದಿ ಮಾಡಿದೆ"
  QR-FIRST-PAYEE:
    hi: "आपके परिवार से इस व्यक्ति को यह पहला भुगतान है"
    kn: "ನಿಮ್ಮ ಕುಟುಂಬದಿಂದ ಇವರಿಗೆ ಇದು ಮೊದಲ ಪಾವತಿ"
  QR-FIRST-PAYEE-HIGH-AMOUNT:
    hi: "इस व्यक्ति को पहला भुगतान है और रकम परिवार की तय सीमा से ज़्यादा है"
    kn: "ಇವರಿಗೆ ಮೊದಲ ಪಾವತಿ, ಮತ್ತು ಮೊತ್ತ ಕುಟುಂಬ ನಿಗದಿಪಡಿಸಿದ ಮಿತಿಗಿಂತ ಹೆಚ್ಚು"
  QR-LARGE-AMOUNT:
    hi: "QR भुगतान के लिए रकम असामान्य रूप से बड़ी है"
    kn: "QR ಪಾವತಿಗೆ ಮೊತ್ತ ಅಸಾಮಾನ್ಯವಾಗಿ ದೊಡ್ಡದಾಗಿದೆ"
  URL-UNPARSEABLE:
    hi: "इस लिंक को सामान्य वेब पते की तरह पढ़ा नहीं जा सका"
    kn: "ಈ ಲಿಂಕ್ ಅನ್ನು ಸಾಮಾನ್ಯ ವೆಬ್ ವಿಳಾಸವಾಗಿ ಓದಲಾಗಲಿಲ್ಲ"
  URL-RAW-IP:
    hi: "लिंक किसी वेबसाइट के नाम की जगह सीधे IP पते पर जाता है"
    kn: "ಲಿಂಕ್ ವೆಬ್‌ಸೈಟ್ ಹೆಸರಿನ ಬದಲು ನೇರವಾಗಿ IP ವಿಳಾಸಕ್ಕೆ ಹೋಗುತ್ತದೆ"
  URL-PUNYCODE:
    hi: "वेब पते में छिपे या मिलते-जुलते अक्षर हैं"
    kn: "ವೆಬ್ ವಿಳಾಸದಲ್ಲಿ ಮರೆಮಾಡಿದ ಅಥವಾ ಹೋಲುವ ಅಕ್ಷರಗಳಿವೆ"
  URL-MIXED-SCRIPT:
    hi: "असली साइट जैसा दिखाने के लिए वेब पते में अलग-अलग लिपियों के अक्षर मिलाए गए हैं"
    kn: "ನಿಜವಾದ ಸೈಟ್‌ನಂತೆ ಕಾಣಲು ವೆಬ್ ವಿಳಾಸದಲ್ಲಿ ಬೇರೆ ಬೇರೆ ಲಿಪಿಯ ಅಕ್ಷರಗಳನ್ನು ಬೆರೆಸಲಾಗಿದೆ"
  URL-LOOKALIKE:
    hi: "वेबसाइट का नाम किसी असली ब्रांड जैसा दिखता है, लेकिन यह उसकी आधिकारिक साइट नहीं है"
    kn: "ವೆಬ್‌ಸೈಟ್ ಹೆಸರು ನಿಜವಾದ ಬ್ರ್ಯಾಂಡ್‌ನಂತೆ ಕಾಣುತ್ತದೆ, ಆದರೆ ಇದು ಅದರ ಅಧಿಕೃತ ಸೈಟ್ ಅಲ್ಲ"
  URL-BRAND-IN-DOMAIN:
    hi: "ब्रांड का नाम ऐसी वेबसाइट में है जो उस ब्रांड की आधिकारिक साइट नहीं है"
    kn: "ಬ್ರ್ಯಾಂಡ್ ಹೆಸರು ಆ ಬ್ರ್ಯಾಂಡ್‌ನ ಅಧಿಕೃತವಲ್ಲದ ವೆಬ್‌ಸೈಟ್‌ನಲ್ಲಿದೆ"
  URL-RISKY-TLD:
    hi: "वेबसाइट का अंतिम हिस्सा अक्सर धोखाधड़ी वाली साइटों में इस्तेमाल होता है"
    kn: "ವೆಬ್‌ಸೈಟ್‌ನ ಕೊನೆಯ ಭಾಗ ಹೆಚ್ಚಾಗಿ ವಂಚನೆ ಸೈಟ್‌ಗಳಲ್ಲಿ ಬಳಕೆಯಾಗುತ್ತದೆ"
  URL-AT-SIGN:
    hi: "लिंक @ चिह्न के पीछे अपना असली पता छिपाता है"
    kn: "ಲಿಂಕ್ @ ಚಿಹ್ನೆಯ ಹಿಂದೆ ತನ್ನ ನಿಜವಾದ ವಿಳಾಸವನ್ನು ಮರೆಮಾಡುತ್ತದೆ"
  URL-SHORTENER:
    hi: "लिंक छोटा किया गया है, इसलिए असली पता छिपा है"
    kn: "ಲಿಂಕ್ ಅನ್ನು ಚಿಕ್ಕದಾಗಿಸಲಾಗಿದೆ, ಆದ್ದರಿಂದ ನಿಜವಾದ ವಿಳಾಸ ಮರೆಯಾಗಿದೆ"
  URL-HTTP-LOGIN:
    hi: "लॉगिन या KYC पेज बिना सुरक्षा (http) के खुलता है"
    kn: "ಲಾಗಿನ್ ಅಥವಾ KYC ಪುಟ ಸುರಕ್ಷತೆ ಇಲ್ಲದೆ (http) ತೆರೆಯುತ್ತದೆ"
  URL-APK:
    hi: "लिंक ऐप स्टोर के बाहर से एंड्रॉइड ऐप फ़ाइल (.apk) डाउनलोड करता है"
    kn: "ಲಿಂಕ್ ಆ್ಯಪ್ ಸ್ಟೋರ್ ಹೊರಗಿನಿಂದ ಆಂಡ್ರಾಯ್ಡ್ ಆ್ಯಪ್ ಫೈಲ್ (.apk) ಡೌನ್‌ಲೋಡ್ ಮಾಡುತ್ತದೆ"
  URL-LURE-KEYWORD:
    hi: "लिंक में अनाधिकारिक वेबसाइट पर KYC, रिफंड या इनाम जैसे शब्द हैं"
    kn: "ಅಧಿಕೃತವಲ್ಲದ ವೆಬ್‌ಸೈಟ್‌ನಲ್ಲಿ KYC, ಮರುಪಾವತಿ ಅಥವಾ ಬಹುಮಾನದಂತಹ ಪದಗಳಿವೆ"
  URL-NONSTANDARD-PORT:
    hi: "लिंक असामान्य नेटवर्क पोर्ट का इस्तेमाल करता है"
    kn: "ಲಿಂಕ್ ಅಸಾಮಾನ್ಯ ನೆಟ್‌ವರ್ಕ್ ಪೋರ್ಟ್ ಬಳಸುತ್ತದೆ"
  URL-MANY-SUBDOMAINS:
    hi: "वेब पते में असामान्य रूप से कई सब-डोमेन हैं"
    kn: "ವೆಬ್ ವಿಳಾಸದಲ್ಲಿ ಅಸಾಮಾನ್ಯವಾಗಿ ಹಲವು ಉಪ-ಡೊಮೇನ್‌ಗಳಿವೆ"
  PB-DIGITAL-ARREST:
    hi: "यह 'डिजिटल अरेस्ट' धोखाधड़ी लगती है: एक 'अधिकारी' गिरफ्तारी की धमकी देकर पैसे या चुप रहने को कहता है"
    kn: "ಇದು 'ಡಿಜಿಟಲ್ ಅರೆಸ್ಟ್' ವಂಚನೆಯಂತೆ ಕಾಣುತ್ತದೆ: 'ಅಧಿಕಾರಿ' ಬಂಧನದ ಬೆದರಿಕೆ ಹಾಕಿ ಹಣ ಅಥವಾ ಗೌಪ್ಯತೆ ಕೇಳುತ್ತಾರೆ"
  PB-KYC-EXPIRY:
    hi: "यह नकली KYC संदेश लगता है: तुरंत कुछ न करने पर खाता बंद करने की धमकी दी गई है"
    kn: "ಇದು ನಕಲಿ KYC ಸಂದೇಶದಂತೆ ಕಾಣುತ್ತದೆ: ತಕ್ಷಣ ಮಾಡದಿದ್ದರೆ ಖಾತೆ ಸ್ಥಗಿತಗೊಳಿಸುವ ಬೆದರಿಕೆ ಇದೆ"
  PB-ELECTRICITY:
    hi: "यह बिजली काटने का नकली संदेश लगता है"
    kn: "ಇದು ವಿದ್ಯುತ್ ಕಡಿತದ ನಕಲಿ ಸಂದೇಶದಂತೆ ಕಾಣುತ್ತದೆ"
  PB-PARCEL-CUSTOMS:
    hi: "यह पार्सल या कस्टम का नकली संदेश लगता है"
    kn: "ಇದು ಪಾರ್ಸೆಲ್ ಅಥವಾ ಕಸ್ಟಮ್ಸ್‌ನ ನಕಲಿ ಸಂದೇಶದಂತೆ ಕಾಣುತ್ತದೆ"
  PB-LOTTERY-CASHBACK:
    hi: "यह लॉटरी या कैशबैक धोखाधड़ी लगती है: इनाम पाने के लिए पैसे देने को कहा गया है"
    kn: "ಇದು ಲಾಟರಿ ಅಥವಾ ಕ್ಯಾಶ್‌ಬ್ಯಾಕ್ ವಂಚನೆಯಂತೆ ಕಾಣುತ್ತದೆ: ಬಹುಮಾನ ಪಡೆಯಲು ಹಣ ಕಟ್ಟಲು ಹೇಳಲಾಗಿದೆ"
  PB-TASK-JOB:
    hi: "यह टास्क या पार्ट-टाइम नौकरी वाली धोखाधड़ी लगती है"
    kn: "ಇದು ಟಾಸ್ಕ್ ಅಥವಾ ಅರೆಕಾಲಿಕ ಕೆಲಸದ ವಂಚನೆಯಂತೆ ಕಾಣುತ್ತದೆ"
  PB-RELATIVE-IN-TROUBLE:
    hi: "कोई खुद को मुसीबत में फँसा रिश्तेदार बताकर पैसे माँग रहा है"
    kn: "ಯಾರೋ ತಾವು ತೊಂದರೆಯಲ್ಲಿರುವ ಸಂಬಂಧಿಕರೆಂದು ಹೇಳಿ ಹಣ ಕೇಳುತ್ತಿದ್ದಾರೆ"
  PB-OTP-REQUEST:
    hi: "संदेश OTP या PIN बताने को कहता है। किसी असली व्यक्ति को इसकी ज़रूरत नहीं होती"
    kn: "ಸಂದೇಶ OTP ಅಥವಾ PIN ಹೇಳಲು ಕೇಳುತ್ತದೆ. ನಿಜವಾದ ಯಾರಿಗೂ ಅದು ಬೇಕಾಗಿಲ್ಲ"
  PB-REMOTE-APP:
    hi: "संदेश स्क्रीन-शेयरिंग या रिमोट-कंट्रोल ऐप इंस्टॉल करने को कहता है"
    kn: "ಸಂದೇಶ ಸ್ಕ್ರೀನ್-ಶೇರಿಂಗ್ ಅಥವಾ ರಿಮೋಟ್-ಕಂಟ್ರೋಲ್ ಆ್ಯಪ್ ಇನ್‌ಸ್ಟಾಲ್ ಮಾಡಲು ಹೇಳುತ್ತದೆ"
  PB-PRESSURE-PAYMENT:
    hi: "संदेश अधिकार का दावा करते हुए तुरंत भुगतान का दबाव डालता है"
    kn: "ಸಂದೇಶ ಅಧಿಕಾರದ ಹೆಸರಿನಲ್ಲಿ ತಕ್ಷಣ ಪಾವತಿಸಲು ಒತ್ತಡ ಹಾಕುತ್ತದೆ"
