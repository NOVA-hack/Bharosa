playbooks:
  PB-DIGITAL-ARREST:
    title: "Looks like a 'digital arrest' scam: an 'officer' threatens arrest and demands money or secrecy"
    severity: high
    always_high: true
    all_of: [authority, threat]
    any_of: [payment, secrecy, video_call, urgency]
    min_any: 1
    truth_card: TC-DIGITAL-ARREST
  PB-KYC-EXPIRY:
    title: "Looks like a fake KYC message: it threatens to block your account unless you act"
    severity: high
    all_of: [kyc]
    any_of: [account_block, threat, urgency, payment, otp_request]
    min_any: 1
    truth_card: TC-KYC
  PB-ELECTRICITY:
    title: "Looks like a fake electricity cut-off message"
    severity: high
    all_of: [electricity]
    any_of: [threat, urgency, payment]
    min_any: 2
    truth_card: TC-ELECTRICITY
  PB-PARCEL-CUSTOMS:
    title: "Looks like a fake parcel or customs message"
    severity: high
    all_of: [parcel]
    any_of: [authority, threat, payment, urgency]
    min_any: 2
    truth_card: TC-PARCEL
  PB-LOTTERY-CASHBACK:
    title: "Looks like a lottery or cashback scam: you are asked to pay to receive a prize"
    severity: high
    all_of: [prize]
    any_of: [payment, otp_request, urgency]
    min_any: 1
    truth_card: TC-PRIZE
  PB-TASK-JOB:
    title: "Looks like a task or part-time job scam"
    severity: medium
    all_of: [job]
    any_of: [payment, prize]
    min_any: 1
    truth_card: TC-JOB
  PB-RELATIVE-IN-TROUBLE:
    title: "Someone claims to be a relative in trouble and asks for money"
    severity: high
    all_of: [relative]
    any_of: [trouble, payment, secrecy]
    min_any: 2
    truth_card: TC-RELATIVE
    code_word_prompt: true
  PB-OTP-REQUEST:
    title: "The message asks you to share an OTP or PIN. Nobody genuine ever needs it"
    severity: high
    always_high: true
    all_of: [otp_request]
    any_of: []
    min_any: 0
    truth_card: TC-OTP
  PB-REMOTE-APP:
    title: "The message asks you to install a screen-sharing or remote-control app"
    severity: high
    all_of: [remote_app]
    any_of: [payment, kyc, otp_request, authority, urgency, prize]
    min_any: 1
    truth_card: TC-REMOTE-APP
  PB-PRESSURE-PAYMENT:
    title: "The message pressures you to pay urgently while claiming authority"
    severity: medium
    all_of: [payment, urgency]
    any_of: [authority, threat, secrecy]
    min_any: 1
