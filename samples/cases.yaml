# Labeled synthetic corpus for `bharosa eval`. Every value here is invented by the team.
# No real UPI IDs, phone numbers, Aadhaar numbers or private messages.
# label: scam | benign.  expected: the risk level we want (low | medium | high).
# A scam counts as caught when flagged medium or high; a benign case passes when it stays low.

cases:
  # ---------------- QR: benign ----------------
  - id: qr-shop
    type: qr
    label: benign
    expected: low
    input: "upi://pay?pa=sharmagrocery.demo@okaxis&pn=Sharma%20Grocery&am=240&cu=INR&tn=Order%2017"
  - id: qr-milk
    type: qr
    label: benign
    expected: low
    input: "upi://pay?pa=nandini.milk.demo@ybl&pn=Nandini%20Milk%20Booth&cu=INR"
  - id: qr-pharmacy
