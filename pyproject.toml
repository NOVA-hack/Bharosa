[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bharosa"
version = "0.1.0"
description = "A family safety layer for suspicious UPI QR codes, links and scam messages (hackathon prototype)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Team Hydreigon" }]
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pyyaml>=6",
  "opencv-python-headless>=4.8",
  "numpy>=1.26",
  "mcp>=2.0",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "qrcode>=7.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
keyring = ["keyring>=24"]
s3 = ["boto3>=1.34"]

[project.scripts]
bharosa = "bharosa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bharosa = ["rules/packs/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
